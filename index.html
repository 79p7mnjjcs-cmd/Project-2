<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ff0000">
  <title>Мой первый файл</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      color: #f8f5ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ff0000;
    }
    main {
      width: min(100%, 1060px);
      padding: 64px 24px;
      text-align: center;
      animation: appear 1.3s ease-out both;
    }
    .eyebrow {
      margin: 0 0 28px;
      color: #b9a6ec;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0 auto;
      max-width: 950px;
      font-size: clamp(32px, 5.8vw, 72px);
      line-height: 1.15;
      letter-spacing: -.045em;
      font-weight: 750;
      text-wrap: balance;
      text-shadow: 0 0 32px #b394ff45, 0 0 80px #9874ff25;
    }
    button {
      margin-top: 42px;
      padding: 17px 32px;
      border: 1px solid #d6c4ff70;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, #9365ee, #6456d9);
      box-shadow: 0 8px 35px #8057e63d;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
      transition: transform .2s, box-shadow .2s;
    }
    button:hover { transform: translateY(-3px); box-shadow: 0 12px 42px #a47aff65; }
    button:active { transform: translateY(0) scale(.97); }
    button:focus-visible { outline: 3px solid #e0d4ff; outline-offset: 6px; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      main { animation: none; }
      button { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Начало чего-то классного</p>
    <h1>Привет! Это мой первый файл, который собрал ИИ-агент</h1>
    <button type="button" id="celebrate">Нажми меня</button>
  </main>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <script>
    const canvas = document.getElementById('confetti');
    const context = canvas.getContext('2d');
    const button = document.getElementById('celebrate');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    const colors = ['#b499ff', '#76e3ed', '#ffd68a', '#ff8cbd', '#ffffff'];
    let particles = [];
    let frame = null;
    let lastTime = 0;

    function resize() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(innerWidth * ratio);
      canvas.height = Math.round(innerHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    function draw(time) {
      const step = Math.min((time - lastTime) / 16.667, 2);
      lastTime = time;
      context.clearRect(0, 0, innerWidth, innerHeight);
      particles = particles.filter(p => p.life > 0 && p.y < innerHeight + 30);
      for (const p of particles) {
        p.x += p.vx * step;
        p.y += p.vy * step;
        p.vy += .13 * step;
        p.rotation += p.spin * step;
        p.life -= step;
        context.save();
        context.translate(p.x, p.y);
        context.rotate(p.rotation);
        context.globalAlpha = Math.min(1, Math.max(0, p.life / 30));
        context.fillStyle = p.color;
        context.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        context.restore();
      }
      frame = particles.length ? requestAnimationFrame(draw) : null;
    }

    button.addEventListener('click', () => {
      const rect = button.getBoundingClientRect();
      const count = reducedMotion.matches ? 24 : 150;
      particles = particles.slice(-450);
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = reducedMotion.matches ? 2 : 4 + Math.random() * 9;
        particles.push({
          x: rect.left + rect.width / 2,
          y: rect.top + rect.height / 2,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - (reducedMotion.matches ? 1 : 5),
          rotation: Math.random() * Math.PI,
          spin: (Math.random() - .5) * .2,
          size: 5 + Math.random() * 7,
          color: colors[Math.floor(Math.random() * colors.length)],
          life: reducedMotion.matches ? 25 : 150 + Math.random() * 60
        });
      }
      if (frame === null) {
        lastTime = performance.now();
        frame = requestAnimationFrame(draw);
      }
    });
  </script>
</body>
</html>
